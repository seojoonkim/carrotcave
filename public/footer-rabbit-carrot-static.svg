<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="190" viewBox="0 0 1100 190" role="img" aria-labelledby="title description">
  <title id="title">당근과 장난치는 토끼의 20초 이야기</title>
  <desc id="description">토끼가 귀를 쫑긋하고 눈을 깜빡인 뒤 두 번 가볍게 뛰어 당근에 다가가 킁킁대면 당근이 통통 튀는 20초 애니메이션</desc>
  <g class="scene">
    <g id="footer-rabbit-static" class="rabbit-position">
      <g class="rabbit-body">
        <ellipse cx="480" cy="145" rx="44" ry="31" fill="#dedbd4"/>
        <ellipse cx="468" cy="135" rx="30" ry="24" fill="#eeeae3"/>
        <circle cx="511" cy="120" r="28" fill="#f4f0e9"/>
        <g class="rabbit-ear-left">
          <ellipse cx="497" cy="82" rx="10" ry="35" fill="#f4f0e9" transform="rotate(-9 497 82)"/>
          <ellipse cx="497" cy="82" rx="4" ry="27" fill="#d9a09d" opacity=".62" transform="rotate(-9 497 82)"/>
        </g>
        <g class="rabbit-ear-right">
          <ellipse cx="520" cy="80" rx="10" ry="37" fill="#f4f0e9" transform="rotate(8 520 80)"/>
          <ellipse cx="520" cy="80" rx="4" ry="29" fill="#d9a09d" opacity=".62" transform="rotate(8 520 80)"/>
        </g>
        <g class="rabbit-eye">
          <circle cx="521" cy="115" r="4" fill="#20242d"/>
          <circle cx="522" cy="114" r="1.2" fill="#fff" opacity=".9"/>
        </g>
        <ellipse class="rabbit-nose" cx="537" cy="124" rx="3.5" ry="2.7" fill="#b87c78"/>
        <path d="M538 127c4 2 5 5 1 7M539 128c-3 3-3 6 0 8" fill="none" stroke="#9c7772" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="526" cy="128" r="6" fill="#e9a29b" opacity=".2"/>
        <path d="m539 125 19-3m-19 7 20 3m-22 1 17 8" fill="none" stroke="#d9d4cc" stroke-width="1.2" stroke-linecap="round"/>
        <circle class="rabbit-tail" cx="437" cy="137" r="16" fill="#f4f0e9"/>
        <ellipse cx="458" cy="166" rx="24" ry="9" fill="#e5e1da"/>
        <ellipse cx="509" cy="167" rx="25" ry="9" fill="#e5e1da"/>
      </g>
    </g>
    <g class="carrot-position" transform="translate(780 94) rotate(-8)">
      <g class="carrot">
        <g transform="scale(3.4167)">
          <path d="M0 0c9 1 13 7 8 24C2 17-2 8 0 0Z" fill="#f28c28"/>
          <g class="carrot-leaves">
            <path d="M3 1C0-7 1-13 4-17M5 1c4-8 8-12 12-14M4 0c7-5 12-6 16-5" fill="none" stroke="#79a85b" stroke-width="3.5" stroke-linecap="round"/>
          </g>
          <path d="m2 7 6 2m-5 5 4 1" fill="none" stroke="#ffad4d" stroke-width="1.2" stroke-linecap="round"/>
        </g>
      </g>
    </g>
    <g class="surprise" fill="none" stroke="#f5d14b" stroke-width="3" stroke-linecap="round">
      <path d="m830 52 9-11M845 61l13-5M819 38l2-13"/>
    </g>
    <use href="#footer-rabbit-static"/>
  </g>
</svg>
