<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="190" viewBox="0 0 1100 190" role="img" aria-labelledby="title description">
  <title id="title">당근과 장난치는 토끼의 20초 이야기</title>
  <desc id="description">토끼가 귀를 쫑긋하고 눈을 깜빡인 뒤 두 번 가볍게 뛰어 당근에 다가가 킁킁대면 당근이 통통 튀는 20초 애니메이션</desc>
  <style>
    .scene { transform-origin: center; animation: scene-loop 20s ease-in-out infinite; }
    .rabbit-position { transform-origin: 480px 145px; animation: rabbit-hop 20s linear infinite; }
    .rabbit-body { transform-box: fill-box; transform-origin: center bottom; animation: rabbit-squash 20s ease-in-out infinite; }
    .rabbit-ear-left { transform-box: fill-box; transform-origin: center bottom; animation: ear-left 20s ease-in-out infinite; }
    .rabbit-ear-right { transform-box: fill-box; transform-origin: center bottom; animation: ear-right 20s ease-in-out infinite; }
    .rabbit-eye { transform-box: fill-box; transform-origin: center; animation: rabbit-blink 20s linear infinite; }
    .rabbit-nose { transform-box: fill-box; transform-origin: center; animation: nose-sniff 20s ease-in-out infinite; }
    .rabbit-tail { transform-box: fill-box; transform-origin: right center; animation: tail-wiggle 20s ease-in-out infinite; }
    .carrot { transform-box: fill-box; transform-origin: center bottom; animation: carrot-surprise 20s ease-in-out infinite; }
    .carrot-leaves { transform-box: fill-box; transform-origin: center bottom; animation: leaves-flutter 20s ease-in-out infinite; }
    .surprise { opacity: 0; animation: surprise-pop 20s ease-out infinite; }
    @keyframes scene-loop {
      0%,92% { opacity: 1; }
      95%,98% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes rabbit-hop {
      0%,18% { transform: translate(0,0); }
      20% { transform: translate(0,2px) scale(1.012,.988); }
      24% { transform: translate(32px,-20px) rotate(-1deg); }
      28% { transform: translate(64px,0); }
      30%,32% { transform: translate(64px,0); }
      34% { transform: translate(64px,2px) scale(1.012,.988); }
      38% { transform: translate(92px,-17px) rotate(1deg); }
      42% { transform: translate(120px,0); }
      44% { transform: translate(120px,2px) scale(1.012,.988); }
      46%,95% { transform: translate(120px,0); }
      95.01%,100% { transform: translate(0,0); }
    }
    @keyframes rabbit-squash {
      0%,19%,25%,29%,33%,39%,43%,100% { transform: scale(1); }
      20%,34%,44% { transform: scale(1.02,.98); }
      24%,38% { transform: scale(.992,1.01); }
    }
    @keyframes ear-left {
      0%,6%,10%,18%,29%,33%,45%,100% { transform: rotate(0); }
      8% { transform: rotate(-9deg); }
      12% { transform: rotate(5deg); }
      24%,38% { transform: rotate(-7deg); }
      28%,42% { transform: rotate(4deg); }
      52%,58% { transform: rotate(-4deg); }
      55%,61% { transform: rotate(3deg); }
    }
    @keyframes ear-right {
      0%,6%,10%,18%,29%,33%,45%,100% { transform: rotate(0); }
      8% { transform: rotate(7deg); }
      12% { transform: rotate(-4deg); }
      24%,38% { transform: rotate(6deg); }
      28%,42% { transform: rotate(-4deg); }
      52%,58% { transform: rotate(3deg); }
      55%,61% { transform: rotate(-3deg); }
    }
    @keyframes rabbit-blink {
      0%,5%,7%,16%,18%,48%,50%,100% { transform: scaleY(1); }
      6%,17%,49% { transform: scaleY(.12); }
    }
    @keyframes nose-sniff {
      0%,46%,64%,100% { transform: translate(0,0); }
      49%,55%,61% { transform: translate(1.8px,-.8px) scale(1.08); }
      52%,58% { transform: translate(-.6px,.4px) scale(.96); }
    }
    @keyframes tail-wiggle {
      0%,45%,65%,100% { transform: rotate(0); }
      49%,57% { transform: rotate(-9deg) scale(1.04); }
      53%,61% { transform: rotate(7deg); }
    }
    @keyframes carrot-surprise {
      0%,52%,72%,100% { transform: translateY(0) rotate(0); }
      55% { transform: translateY(-8px) rotate(4deg); }
      58% { transform: translateY(0) rotate(-3deg); }
      62% { transform: translateY(-5px) rotate(2deg); }
      65% { transform: translateY(0) rotate(-1deg); }
      68% { transform: translateY(-2px) rotate(1deg); }
    }
    @keyframes leaves-flutter {
      0%,52%,74%,100% { transform: rotate(0); }
      55% { transform: rotate(-9deg); }
      58% { transform: rotate(7deg); }
      62% { transform: rotate(-6deg); }
      66% { transform: rotate(4deg); }
      70% { transform: rotate(-2deg); }
    }
    @keyframes surprise-pop {
      0%,53%,69%,100% { opacity: 0; transform: scale(.75); }
      55%,58% { opacity: .6; transform: scale(1); }
      62%,65% { opacity: .38; transform: scale(.9); }
    }
    @media (prefers-reduced-motion: reduce) {
      .scene,.rabbit-position,.rabbit-body,.rabbit-ear-left,.rabbit-ear-right,.rabbit-eye,.rabbit-nose,.rabbit-tail,.carrot,.carrot-leaves,.surprise { animation: none !important; }
    }
  </style>
  <g class="scene">
    <g class="rabbit-position">
      <g class="rabbit-body">
        <ellipse cx="480" cy="145" rx="44" ry="31" fill="#dedbd4"/>
        <ellipse cx="468" cy="135" rx="30" ry="24" fill="#eeeae3"/>
        <circle cx="511" cy="120" r="28" fill="#f4f0e9"/>
        <g class="rabbit-ear-left">
          <ellipse cx="497" cy="82" rx="10" ry="35" fill="#f4f0e9" transform="rotate(-9 497 82)"/>
          <ellipse cx="497" cy="82" rx="4" ry="27" fill="#d9a09d" opacity=".62" transform="rotate(-9 497 82)"/>
        </g>
        <g class="rabbit-ear-right">
          <ellipse cx="520" cy="80" rx="10" ry="37" fill="#f4f0e9" transform="rotate(8 520 80)"/>
          <ellipse cx="520" cy="80" rx="4" ry="29" fill="#d9a09d" opacity=".62" transform="rotate(8 520 80)"/>
        </g>
        <g class="rabbit-eye">
          <circle cx="521" cy="115" r="4" fill="#20242d"/>
          <circle cx="522" cy="114" r="1.2" fill="#fff" opacity=".9"/>
        </g>
        <ellipse class="rabbit-nose" cx="537" cy="124" rx="3.5" ry="2.7" fill="#b87c78"/>
        <path d="M538 127c4 2 5 5 1 7M539 128c-3 3-3 6 0 8" fill="none" stroke="#9c7772" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="526" cy="128" r="6" fill="#e9a29b" opacity=".2"/>
        <path d="m539 125 19-3m-19 7 20 3m-22 1 17 8" fill="none" stroke="#d9d4cc" stroke-width="1.2" stroke-linecap="round"/>
        <circle class="rabbit-tail" cx="437" cy="137" r="16" fill="#f4f0e9"/>
        <ellipse cx="458" cy="166" rx="24" ry="9" fill="#e5e1da"/>
        <ellipse cx="509" cy="167" rx="25" ry="9" fill="#e5e1da"/>
      </g>
    </g>
    <g class="carrot-position" transform="translate(780 94) rotate(-8)">
      <g class="carrot">
        <path d="M0 0c31 3 46 25 25 82C6 61-8 27 0 0Z" fill="#ed7d31"/>
        <path d="M3 6c17 5 27 20 26 39-1 13-5 25-10 34" fill="none" stroke="#ffc06a" stroke-width="4" stroke-linecap="round" opacity=".58"/>
        <path d="m4 18 25 6M7 37l18 4M11 55l10 2" stroke="#7f361e" stroke-width="2.6" stroke-linecap="round" opacity=".48"/>
        <g class="carrot-leaves">
          <path d="M10 2C-1-22 2-45 13-60M16 2c15-25 31-41 49-50M14 1c25-14 44-17 61-13" fill="none" stroke="#75b77a" stroke-width="11" stroke-linecap="round"/>
          <path d="M12 0C7-23 9-41 15-55M18 0c14-22 28-36 45-45" fill="none" stroke="#a1d09a" stroke-width="3" stroke-linecap="round" opacity=".62"/>
        </g>
      </g>
    </g>
    <g class="surprise" fill="none" stroke="#f5d14b" stroke-width="3" stroke-linecap="round">
      <path d="m830 52 9-11M845 61l13-5M819 38l2-13"/>
    </g>
  </g>
</svg>
