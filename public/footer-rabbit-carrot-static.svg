      <stop offset="0" stop-color="#f39a52"/><stop offset="1" stop-color="#f39a52"/>
    </linearGradient>
    <radialGradient id="rb-coat" cx="42%" cy="32%" r="80%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f6f8fb"/><stop offset="1" stop-color="#e3e9f1"/>
    </radialGradient>
