    <radialGradient id="ff-glow"><stop offset="0" stop-color="#ffe9a3" stop-opacity=".75"/><stop offset="1" stop-color="#ffe9a3" stop-opacity="0"/></radialGradient>
    <radialGradient id="lantern-glow"><stop offset="0" stop-color="#ffc56b" stop-opacity=".45"/><stop offset="1" stop-color="#ffc56b" stop-opacity="0"/></radialGradient>
    <linearGradient id="shoot-tail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6dc" stop-opacity="0"/><stop offset="1" stop-color="#fff6dc"/></linearGradient>
