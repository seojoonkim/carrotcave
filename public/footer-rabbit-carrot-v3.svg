<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="190" viewBox="0 0 1100 190" role="img" aria-labelledby="footer-rabbit-title footer-rabbit-description">
  <title id="footer-rabbit-title">당근에게 깡충깡충 다가가는 토끼</title>
  <desc id="footer-rabbit-description">토끼가 네 번 뛰어 졸고 있던 당근에게 다가가 냄새를 맡자, 깜짝 놀란 당근이 흙 속으로 쏙 숨고 토끼는 고개를 갸웃한다. 당근이 반짝이며 튀어 올라 윙크하면 둘이 볼을 비비고 하트가 떠오르는 16초 애니메이션</desc>
  <defs>
    <linearGradient id="footer-carrot-skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffad4d"/><stop offset=".38" stop-color="#ffad4d"/>
      <stop offset=".39" stop-color="#f39a52"/><stop offset=".72" stop-color="#f39a52"/>
      <stop offset=".73" stop-color="#d9651f"/><stop offset="1" stop-color="#d9651f"/>
    </linearGradient>
    <radialGradient id="rb-coat" cx="42%" cy="32%" r="80%">
      <stop offset="0" stop-color="#fffaf2"/><stop offset=".7" stop-color="#f5ede1"/><stop offset="1" stop-color="#e6dccd"/>
    </radialGradient>
    <clipPath id="ground-clip"><rect x="880" y="0" width="180" height="169.5"/></clipPath>
  </defs>
  <style>
    .scene{animation:scene-loop 16s ease-in-out infinite}
    .rabbit-position{animation:rabbit-journey 16s ease-in-out infinite}
    .rabbit-body{transform-box:fill-box;transform-origin:center bottom;animation:rabbit-squash 16s ease-in-out infinite}
    .rabbit-shadow{transform-box:fill-box;transform-origin:center;animation:shadow-hop 16s ease-in-out infinite}
    .rabbit-head{transform-box:fill-box;transform-origin:30% 85%;animation:head-mood 16s ease-in-out infinite}
    .rabbit-ear-back,.rabbit-ear-front{transform-box:fill-box;transform-origin:center bottom}
    .rabbit-ear-back{animation:ear-back 16s ease-in-out infinite}
    .rabbit-ear-front{animation:ear-front 16s ease-in-out infinite}
    .rabbit-eye-blink{transform-box:fill-box;transform-origin:center;animation:rabbit-blink 16s linear infinite}
    .rabbit-eyes-open{animation:eyes-open 16s linear infinite}
    .rabbit-eyes-happy{opacity:0;animation:eyes-happy 16s linear infinite}
    .rabbit-nose{transform-box:fill-box;transform-origin:center;animation:nose-sniff 16s ease-in-out infinite}
    .rabbit-whiskers{transform-box:fill-box;transform-origin:left center;animation:whisker-quiver 16s ease-in-out infinite}
    .rabbit-tail{transform-box:fill-box;transform-origin:right center;animation:tail-wiggle 16s ease-in-out infinite}
    .rabbit-front-paw{transform-box:fill-box;transform-origin:center;animation:front-paw 16s ease-in-out infinite}
    .rabbit-question-inner{transform-box:fill-box;transform-origin:center bottom;opacity:0;animation:question-pop 16s ease-out infinite}
    .carrot{transform-box:fill-box;transform-origin:center bottom;animation:carrot-play 16s ease-in-out infinite}
    .carrot-leaves{transform-box:fill-box;transform-origin:center bottom;animation:leaves-flutter 16s ease-in-out infinite}
    .carrot-sleep-eyes{animation:carrot-sleep 16s linear infinite}
    .carrot-eyes-open{opacity:0;animation:carrot-awake 16s linear infinite}
    .carrot-pupils{animation:carrot-look 16s ease-in-out infinite}
    .carrot-eye-right{animation:carrot-eye-right 16s linear infinite}
    .carrot-wink{opacity:0;animation:carrot-wink 16s linear infinite}
    .carrot-blush{animation:carrot-blush 16s ease-in-out infinite}
    .zz-a,.zz-b{opacity:0}
    .zz-a{animation:zz-a 16s ease-out infinite}
    .zz-b{animation:zz-b 16s ease-out infinite}
    .dust{transform-box:fill-box;transform-origin:center bottom;opacity:0;animation:dust-puff 16s ease-out infinite}
    .sparkle{transform-box:fill-box;transform-origin:center;opacity:0;animation:sparkle-pop 16s ease-out infinite}
    .heart-a,.heart-b{transform-box:fill-box;transform-origin:center;opacity:0}
    .heart-a{animation:heart-a 16s ease-out infinite}
    .heart-b{animation:heart-b 16s ease-out infinite}
    @keyframes scene-loop{0%,93%{opacity:1}95%,99%{opacity:0}100%{opacity:1}}
    @keyframes rabbit-journey{
      0%,13%{transform:translate(0,0)}18%{transform:translate(85px,-34px)}22%,23%{transform:translate(170px,0)}
      27%{transform:translate(255px,-30px)}31%,32%{transform:translate(340px,0)}36%{transform:translate(425px,-26px)}
      40%,41%{transform:translate(510px,0)}45%{transform:translate(600px,-22px)}49%,62%{transform:translate(690px,0)}
      65%{transform:translate(690px,-20px)}68%,73%{transform:translate(690px,0)}76%{transform:translate(690px,-12px)}
      79%,95.9%{transform:translate(690px,0)}96%,100%{transform:translate(0,0)}
    }
    @keyframes rabbit-squash{0%,11%,20%,29%,38%,47%,52%,62%,70%,74%,80%,100%{transform:scale(1)}13%,22.5%,31.5%,40.5%,49.5%{transform:scale(1.09,.9)}16%,25.5%,34.5%,43.5%{transform:scale(.93,1.09)}64%{transform:scale(.9,1.13)}77%{transform:scale(.94,1.07)}}
    @keyframes shadow-hop{0%,13%,22%,23%,31%,32%,40%,41%,49%,62%,68%,73%,79%,100%{transform:scale(1);opacity:.45}18%,27%,36%,45%{transform:scale(.6);opacity:.2}65%{transform:scale(.7);opacity:.24}76%{transform:scale(.8);opacity:.3}}
    @keyframes head-mood{0%,9%,13%,50%,62%,74%,79%,93%,100%{transform:none}3%{transform:rotate(-7deg)}6.5%{transform:rotate(6deg)}53%,57%{transform:rotate(7deg) translate(2px,1px)}55%,59%{transform:rotate(4deg)}66%,72%{transform:rotate(-14deg)}82%,88%{transform:rotate(9deg) translate(5px,2px)}85%,91%{transform:rotate(6deg) translate(4px,1px)}}
    @keyframes ear-front{0%,3%,6%,12%,50%,62%,72%,80%,92%,100%{transform:rotate(0)}4.5%{transform:rotate(12deg)}16%,25.5%,34.5%,43.5%{transform:rotate(-22deg)}20%,29%,38%,47%{transform:rotate(5deg)}65%,69%{transform:rotate(-4deg) scaleY(1.14)}83%,89%{transform:rotate(12deg)}86%{transform:rotate(-6deg)}}
    @keyframes ear-back{0%,5%,9%,12%,50%,62%,72%,80%,92%,100%{transform:rotate(0)}7%{transform:rotate(-15deg)}16%,25.5%,34.5%,43.5%{transform:rotate(-28deg)}20%,29%,38%,47%{transform:rotate(3deg)}65%,69%{transform:rotate(-8deg) scaleY(1.12)}84%,90%{transform:rotate(-13deg)}87%{transform:rotate(5deg)}}
    @keyframes rabbit-blink{0%,10%,11.2%,47%,48.2%,72.4%,73.6%,100%{transform:scaleY(1)}10.6%,47.6%,73%{transform:scaleY(.1)}}
    @keyframes eyes-open{0%,79.9%,92.1%,100%{opacity:1}80%,92%{opacity:0}}
    @keyframes eyes-happy{0%,79.9%,92.1%,100%{opacity:0}80%,92%{opacity:1}}
    @keyframes nose-sniff{0%,2%,4.5%,50%,61%,100%{transform:none}3%,52%,54.5%,57%,59.5%{transform:translateY(-.8px) scale(1.25)}53.2%,55.8%,58.3%{transform:scale(.9)}}
    @keyframes whisker-quiver{0%,50%,61%,100%{transform:none}52%,55%,58%{transform:rotate(-7deg)}53.5%,56.5%,59.5%{transform:rotate(5deg)}}
    @keyframes tail-wiggle{0%,12%,50%,80%,93%,100%{transform:rotate(0)}16%,25.5%,34.5%,43.5%{transform:rotate(-16deg) scale(1.08)}20%,29%,38%,47%{transform:rotate(8deg)}82%,86%,90%{transform:rotate(-20deg) scale(1.12)}84%,88%,92%{transform:rotate(14deg)}}
    @keyframes front-paw{0%,13%,49%,100%{transform:none}16%,25.5%,34.5%,43.5%{transform:translate(4px,-7px) rotate(-18deg)}20%,29%,38%,47%{transform:translate(-2px,1px)}}
    @keyframes question-pop{0%,62.5%,73.5%,100%{opacity:0;transform:translateY(8px) scale(.4)}64.5%,71.5%{opacity:1;transform:translateY(0) scale(1)}67.5%{opacity:1;transform:translateY(-4px) rotate(10deg) scale(1.08)}}
    @keyframes carrot-play{0%,50%,56%,78%,80%,93%,100%{transform:none}12%,36%{transform:rotate(-3deg)}24%,44%{transform:rotate(3deg)}58%{transform:translateY(-7px) scale(1.06,.94)}61%,72%{transform:translateY(86px)}74%{transform:translateY(-24px) rotate(-7deg)}76%{transform:translateY(3px) scale(1.08,.92)}83%,89%{transform:translateY(-7px) rotate(5deg)}86%,92%{transform:rotate(-4deg)}}
    @keyframes leaves-flutter{0%,50%,93%,100%{transform:none}12%,36%{transform:rotate(4deg)}24%,44%{transform:rotate(-4deg)}58%{transform:rotate(-10deg)}64%,68%{transform:rotate(9deg)}66%,70%{transform:rotate(-9deg)}74%{transform:rotate(16deg) scaleY(1.1)}77%{transform:rotate(-12deg)}80%{transform:rotate(6deg)}83%,89%{transform:rotate(-8deg)}86%,92%{transform:rotate(7deg)}}
    @keyframes carrot-sleep{0%,51.4%,95%,100%{opacity:1}51.5%,94.9%{opacity:0}}
    @keyframes carrot-awake{0%,51.4%,95%,100%{opacity:0}51.5%,94.9%{opacity:1}}
    @keyframes carrot-look{0%,51.5%,58%,100%{transform:none}53%,57%{transform:translateX(-1.8px)}55%{transform:translate(-1.8px,-.8px)}}
    @keyframes carrot-eye-right{0%,76.9%,89.1%,100%{opacity:1}77%,89%{opacity:0}}
    @keyframes carrot-wink{0%,76.9%,89.1%,100%{opacity:0}77%,89%{opacity:1}}
    @keyframes carrot-blush{0%,79%,93%,100%{opacity:.45}82%,90%{opacity:.85}}
    @keyframes zz-a{0%,100%{opacity:0;transform:translate(0,4px) scale(.7)}5%,21%,37%{opacity:.85;transform:translate(0,0) scale(1)}13%,29%,45%{opacity:0;transform:translate(7px,-14px) scale(1.1)}13.1%,29.1%{opacity:0;transform:translate(0,4px) scale(.7)}45.1%{opacity:0;transform:translate(0,4px) scale(.7)}}
    @keyframes zz-b{0%,8%,100%{opacity:0;transform:translate(0,4px) scale(.7)}13%,29%,45%{opacity:.7;transform:translate(0,0) scale(1)}21%,37%,50%{opacity:0;transform:translate(6px,-12px) scale(1.1)}21.1%,37.1%,50.1%{opacity:0;transform:translate(0,4px) scale(.7)}}
    @keyframes dust-puff{0%,60%,64%,73%,78%,100%{opacity:0;transform:scale(.4)}61.5%,74.5%{opacity:.6;transform:scale(1.1)}}
    @keyframes sparkle-pop{0%,73.5%,81%,100%{opacity:0;transform:scale(.2) rotate(0)}75.5%{opacity:1;transform:scale(1.15) rotate(20deg)}78%{opacity:.7;transform:scale(.8) rotate(45deg)}}
    @keyframes heart-a{0%,79%,93%,100%{opacity:0;transform:translateY(8px) scale(.4)}82%{opacity:1;transform:translateY(0) scale(1.1)}84%{transform:translateY(-3px) scale(.95)}91%{opacity:0;transform:translateY(-28px) scale(.9)}}
    @keyframes heart-b{0%,83%,94%,100%{opacity:0;transform:translateY(8px) scale(.4)}86%{opacity:.9;transform:translateY(0) scale(1)}93%{opacity:0;transform:translateY(-24px) scale(.8)}}
    @media (prefers-reduced-motion: reduce){.scene,.rabbit-position,.rabbit-body,.rabbit-shadow,.rabbit-head,.rabbit-ear-back,.rabbit-ear-front,.rabbit-eye-blink,.rabbit-eyes-open,.rabbit-eyes-happy,.rabbit-nose,.rabbit-whiskers,.rabbit-tail,.rabbit-front-paw,.rabbit-question-inner,.carrot,.carrot-leaves,.carrot-sleep-eyes,.carrot-eyes-open,.carrot-pupils,.carrot-eye-right,.carrot-wink,.carrot-blush,.zz-a,.zz-b,.dust,.sparkle,.heart-a,.heart-b{animation:none!important}.scene{opacity:1}.rabbit-position{transform:translate(690px,0)}.rabbit-eyelid,.rabbit-eye-blink{transform:scaleY(1)}.rabbit-eyelid{transform:scaleY(0)}.rabbit-eyes-open{opacity:1}.rabbit-eyes-happy{opacity:0}.rabbit-question-inner{opacity:0}.carrot-sleep-eyes{opacity:0}.carrot-eyes-open{opacity:1}.carrot-eye-right{opacity:0}.carrot-wink{opacity:1}.carrot-blush{opacity:.8}.zz-a,.zz-b,.dust,.sparkle,.heart-b{opacity:0}.heart-a{opacity:.95;transform:none}}
  </style>
