<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="190" viewBox="0 0 1100 190" role="img" aria-labelledby="title description">
  <title id="title">앞에 놓인 당근을 향해 부드럽게 뛰는 토끼</title>
  <desc id="description">토끼가 앞쪽 당근을 향해 두 번 가볍게 뛰고 멈추면 당근 잎이 살짝 반응하는 부드러운 애니메이션</desc>
  <style>
    .scene { transform-origin: center; animation: scene-loop 7.2s ease-in-out infinite; }
    .rabbit-position { transform-origin: 480px 145px; animation: rabbit-hop 7.2s linear infinite; }
    .rabbit-body { transform-box: fill-box; transform-origin: center bottom; animation: rabbit-squash 7.2s ease-in-out infinite; }
    .rabbit-ear-left { transform-box: fill-box; transform-origin: center bottom; animation: ear-left 7.2s ease-in-out infinite; }
    .rabbit-ear-right { transform-box: fill-box; transform-origin: center bottom; animation: ear-right 7.2s ease-in-out infinite; }
    .carrot { transform-box: fill-box; transform-origin: center bottom; animation: carrot-surprise 7.2s ease-in-out infinite; }
    .carrot-leaves { transform-box: fill-box; transform-origin: center bottom; animation: leaves-flutter 7.2s ease-in-out infinite; }
    .surprise { opacity: 0; animation: surprise-pop 7.2s ease-out infinite; }
    @keyframes scene-loop {
      0%,76% { opacity: 1; }
      84%,92% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes rabbit-hop {
      0%,8% { transform: translate(0,0); }
      10% { transform: translate(0,2px) scale(1.015,.985); }
      15% { transform: translate(31px,-22px) rotate(-1.2deg); }
      20% { transform: translate(62px,0); }
      22% { transform: translate(62px,2px) scale(1.015,.985); }
      28% { transform: translate(62px,0); }
      30% { transform: translate(62px,2px) scale(1.012,.988); }
      35% { transform: translate(91px,-18px) rotate(1deg); }
      40% { transform: translate(120px,0); }
      42% { transform: translate(120px,2px) scale(1.015,.985); }
      47%,84% { transform: translate(120px,0); }
      84.01%,100% { transform: translate(0,0); }
    }
    @keyframes rabbit-squash {
      0%,9%,16%,21%,29%,36%,41%,100% { transform: scale(1); }
      10%,22%,30%,42% { transform: scale(1.025,.975); }
      15%,35% { transform: scale(.99,1.012); }
    }
    @keyframes ear-left {
      0%,10%,24%,30%,45%,100% { transform: rotate(0); }
      15%,35% { transform: rotate(-7deg); }
      21%,41% { transform: rotate(4deg); }
    }
    @keyframes ear-right {
      0%,10%,24%,30%,45%,100% { transform: rotate(0); }
      15%,35% { transform: rotate(6deg); }
      21%,41% { transform: rotate(-4deg); }
    }
    @keyframes carrot-surprise {
      0%,40%,54%,100% { transform: translateY(0) rotate(0); }
      43% { transform: translateY(-7px) rotate(4deg); }
      46% { transform: translateY(0) rotate(-3deg); }
      49% { transform: translateY(-2px) rotate(1deg); }
    }
    @keyframes leaves-flutter {
      0%,40%,55%,100% { transform: rotate(0); }
      43% { transform: rotate(-7deg); }
      47% { transform: rotate(5deg); }
      51% { transform: rotate(-2deg); }
    }
    @keyframes surprise-pop {
      0%,40%,51%,100% { opacity: 0; transform: scale(.8); }
      43%,46% { opacity: .55; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .scene,.rabbit-position,.rabbit-body,.rabbit-ear-left,.rabbit-ear-right,.carrot,.carrot-leaves,.surprise { animation: none !important; }
    }
  </style>
  <g class="scene">
    <g class="rabbit-position">
      <g class="rabbit-body">
        <ellipse cx="480" cy="145" rx="44" ry="31" fill="#dedbd4"/>
        <ellipse cx="468" cy="135" rx="30" ry="24" fill="#eeeae3"/>
        <circle cx="511" cy="120" r="28" fill="#f4f0e9"/>
        <g class="rabbit-ear-left">
          <ellipse cx="497" cy="82" rx="10" ry="35" fill="#f4f0e9" transform="rotate(-9 497 82)"/>
          <ellipse cx="497" cy="82" rx="4" ry="27" fill="#d9a09d" opacity=".62" transform="rotate(-9 497 82)"/>
        </g>
        <g class="rabbit-ear-right">
          <ellipse cx="520" cy="80" rx="10" ry="37" fill="#f4f0e9" transform="rotate(8 520 80)"/>
          <ellipse cx="520" cy="80" rx="4" ry="29" fill="#d9a09d" opacity=".62" transform="rotate(8 520 80)"/>
        </g>
        <circle cx="521" cy="115" r="4" fill="#20242d"/>
        <circle cx="522" cy="114" r="1.2" fill="#fff" opacity=".9"/>
        <ellipse cx="537" cy="124" rx="3.5" ry="2.7" fill="#b87c78"/>
        <path d="M538 127c4 2 5 5 1 7M539 128c-3 3-3 6 0 8" fill="none" stroke="#9c7772" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="526" cy="128" r="6" fill="#e9a29b" opacity=".2"/>
        <path d="m539 125 19-3m-19 7 20 3m-22 1 17 8" fill="none" stroke="#d9d4cc" stroke-width="1.2" stroke-linecap="round"/>
        <circle cx="437" cy="137" r="16" fill="#f4f0e9"/>
        <ellipse cx="458" cy="166" rx="24" ry="9" fill="#e5e1da"/>
        <ellipse cx="509" cy="167" rx="25" ry="9" fill="#e5e1da"/>
      </g>
    </g>
    <g class="carrot" transform="translate(780 94) rotate(-8)">
      <path d="M0 0c31 3 46 25 25 82C6 61-8 27 0 0Z" fill="#ed7d31"/>
      <path d="M3 6c17 5 27 20 26 39-1 13-5 25-10 34" fill="none" stroke="#ffc06a" stroke-width="4" stroke-linecap="round" opacity=".58"/>
      <path d="m4 18 25 6M7 37l18 4M11 55l10 2" stroke="#7f361e" stroke-width="2.6" stroke-linecap="round" opacity=".48"/>
      <g class="carrot-leaves">
        <path d="M10 2C-1-22 2-45 13-60M16 2c15-25 31-41 49-50M14 1c25-14 44-17 61-13" fill="none" stroke="#75b77a" stroke-width="11" stroke-linecap="round"/>
        <path d="M12 0C7-23 9-41 15-55M18 0c14-22 28-36 45-45" fill="none" stroke="#a1d09a" stroke-width="3" stroke-linecap="round" opacity=".62"/>
      </g>
    </g>
    <g class="surprise" fill="none" stroke="#f5d14b" stroke-width="3" stroke-linecap="round">
      <path d="m830 52 9-11M845 61l13-5M819 38l2-13"/>
    </g>
  </g>
</svg>
