          <g class="rabbit-ear-front"><ellipse cx="218" cy="70" rx="9" ry="26" transform="rotate(10 218 94)" fill="#fbf6ee" stroke="#d9cdbb" stroke-width="1.1"/><ellipse cx="218" cy="74" rx="4.4" ry="17" transform="rotate(10 218 94)" fill="#f2b6b0" opacity=".85"/></g>
