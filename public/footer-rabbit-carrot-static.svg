<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="190" viewBox="0 0 1100 190" role="img" aria-labelledby="footer-rabbit-title footer-rabbit-description">
  <title id="footer-rabbit-title">당근을 찾아 굴 밖으로 나온 탐험가 토끼</title>
  <desc id="footer-rabbit-description">달토끼가 뜬 밤, 노트를 넣은 가방을 멘 토끼가 토끼굴 옆 등불에서 출발해 탐험·낙서·목소리 표지판을 지나 졸고 있던 당근에게 깡충깡충 다가간다. 놀란 당근이 흙 속에 숨었다가 윙크하며 튀어나오고, 둘이 볼을 비비면 하트가 떠오른다. 하늘에는 별이 반짝이고 종이비행기 편지가 지나간다.</desc>
